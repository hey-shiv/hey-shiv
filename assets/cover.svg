<text x="40" y="52" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" letter-spacing="1.8" fill="#8c7c73">01</text><circle cx="79" cy="48" r="3.5" fill="#ffc46b"/><text x="90" y="52" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" letter-spacing="1.8" fill="#ffc46b">COMPLETE · BELOW PUBLISHED SYSTEMS</text><text x="40" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="32" font-weight="800" letter-spacing="-1" fill="#f6eee9">Cover Song Retrieval</text><text x="40" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="16" fill="#c4b3aa"><tspan x="40" dy="0">Can a machine recognise a song it has never</tspan><tspan x="40" dy="21">heard?</tspan></text><text x="40" y="200" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="23" font-weight="800" fill="#f6eee9">13,000</text><text x="40" y="220" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#8c7c73">benchmark queries</text><text x="187" y="200" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="23" font-weight="800" fill="#f6eee9">30 / 15,000</text><text x="187" y="220" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#8c7c73">shortlist, then DTW</text><text x="366" y="200" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="23" font-weight="800" fill="#f6eee9">142</text><text x="366" y="220" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#8c7c73">tests</text><line x1="540" x2="540" y1="36" y2="214" stroke="#2c221e"/><text x="590" y="40" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" letter-spacing="1.5" fill="#8c7c73">GAP TO BEST SYSTEM (×, LOWER IS BETTER)</text><rect x="614" y="86.0" width="56" height="120.0" rx="3" fill="#8c7c73" opacity="0.55"/><text x="642" y="76.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="17" font-weight="800" fill="#f6eee9">4.5×</text><text x="642" y="226" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#8c7c73">run 1</text><rect x="724" y="176.4" width="56" height="29.6" rx="3" fill="#ff7a45" opacity="1"/><text x="752" y="166.4" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="17" font-weight="800" fill="#f6eee9">1.11×</text><text x="752" y="226" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#8c7c73">run 4</text><path d="M684,108 C718,108 738,136 738,144" fill="none" stroke="#c4b3aa" stroke-width="1" stroke-dasharray="3 4" marker-end="url(#a)"/><defs><marker id="a" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#c4b3aa"/></marker></defs><line x1="600" x2="860" y1="179.3" y2="179.3" stroke="#ffc46b" stroke-dasharray="4 4"/><text x="860" y="173.3" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#ffc46b">best = 1.0×</text><line x1="600" x2="860" y1="206" y2="206" stroke="#2c221e"/></svg>