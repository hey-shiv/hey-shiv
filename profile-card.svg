  <text x="370" y="1032" class="mono" font-size="11" fill="#ddd" text-anchor="middle">›</text>
  <text x="400" y="1032" class="serif" font-size="13" font-weight="300" fill="#aaa">flashy demos</text>

  <line x1="56" y1="1044" x2="804" y2="1044" stroke="#fafafa" stroke-width="1"/>
