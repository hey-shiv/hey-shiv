  <text x="56" y="550" class="mono" font-size="8" fill="#ccc" letter-spacing="1.8">TERMINAL AGENTS  ·  ACTIVE / POST-TRAINING</text>

  <text x="56" y="576" class="serif" font-size="13.5" font-weight="300" fill="#666">Verifier-guided preference learning pipeline for reliable terminal agents —</text>
