  <text x="56" y="1218" class="serif" font-size="14" font-weight="300" font-style="italic" fill="#555">Day 1 — Core Execution Pipeline for Verifier-Guided Terminal Agents</text>
  <text x="804" y="1210" class="mono" font-size="8" fill="#ccc" text-anchor="end" letter-spacing="0.5">May 23, 2026</text>
