  <text x="78" y="274" class="serif" font-size="16" font-weight="300" font-style="italic" fill="#555">Building reliable AI systems through</text>
  <text x="78" y="296" class="serif" font-size="16" font-weight="300" font-style="italic" fill="#555">verifier-guided evaluation and alignment.</text>

  <!-- Body text -->
  <text x="56" y="344" class="serif" font-size="14" font-weight="300" fill="#777">I build verifier-guided AI systems focused on reliability, evaluation infrastructure,</text>
  <text x="56" y="364" class="serif" font-size="14" font-weight="300" fill="#777">and post-training workflows. The work is systems-oriented — structured traces,</text>
  <text x="56" y="384" class="serif" font-size="14" font-weight="300" fill="#777">deterministic verifiers, preference data, reward modeling, and observability</text>
  <text x="56" y="404" class="serif" font-size="14" font-weight="300" fill="#777">surfaces that make failures inspectable.</text>

  <!-- Links -->
  <text x="56" y="436" class="mono" font-size="8.5" fill="#bbb" letter-spacing="1">lab ↗</text>
  <text x="110" y="436" class="mono" font-size="8.5" fill="#bbb" letter-spacing="1">huggingface ↗</text>
  <text x="210" y="436" class="mono" font-size="8.5" fill="#bbb" letter-spacing="1">medium ↗</text>
  <text x="278" y="436" class="mono" font-size="8.5" fill="#bbb" letter-spacing="1">x / @NaadhLabs ↗</text>
  <text x="398" y="436" class="mono" font-size="8.5" fill="#bbb" letter-spacing="1">linkedin ↗</text>

