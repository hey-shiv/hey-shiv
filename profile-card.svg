  <text x="370" y="1096" class="mono" font-size="11" fill="#ddd" text-anchor="middle">›</text>
  <text x="400" y="1096" class="serif" font-size="13" font-weight="300" fill="#aaa">black-box pipelines</text>

  <line x1="56" y1="1108" x2="804" y2="1108" stroke="#fafafa" stroke-width="1"/>
